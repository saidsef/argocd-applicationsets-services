  - annotations:
      artifacthub.io/changes: |
        - kind: fixed
          description: "Sync retry renders a limit, so the configured backoff now applies. ArgoCD performs no retries while the limit is 0"
        - kind: fixed
          description: "gitlab.group no longer stands in for a missing per-repo project; the generator receives group/name"
        - kind: fixed
          description: "The AppProject namespace is normalised the same way as the ApplicationSet namespace"
        - kind: changed
          description: "globals.retryBackoffDuration is replaced by globals.retry, passed straight through to the Application sync policy"
        - kind: changed
          description: "project.destinations defaults to empty and is derived from globals.deployToNamespace and any per-repo namespace"
      artifacthub.io/license: Apache-2.0
