apiVersion: v2
name: argocd-applicationsets-services
description: A Helm chart for ArgoCD ApplicationSets, a declarative, GitOps continuous delivery tool for Kubernetes
type: application
version: &version "0.22.0"
appVersion: *version
kubeVersion: ">= 1.31"
home: https://github.com/saidsef/argocd-applicationsets-services
icon: https://raw.githubusercontent.com/argoproj/argo/master/docs/assets/argo.png
keywords:
  - argoproj
  - argocd
  - gitops
  - continuous deployment
  - applicationsets
  - preview
  - canary
maintainers:
  - name: saidsef
    url: https://saidsef.github.io/argocd-applicationsets-services
sources:
  - https://github.com/saidsef/argocd-applicationsets-services.git
annotations:
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Sync retry renders a limit, so the configured backoff now applies. ArgoCD performs no retries while the limit is 0"
    - kind: fixed
      description: "gitlab.group no longer stands in for a missing per-repo project; the generator receives group/name"
    - kind: fixed
      description: "The AppProject namespace is normalised the same way as the ApplicationSet namespace"
    - kind: changed
      description: "globals.retryBackoffDuration is replaced by globals.retry, passed straight through to the Application sync policy"
    - kind: changed
      description: "project.destinations defaults to empty and is derived from globals.deployToNamespace and any per-repo namespace"
  artifacthub.io/links: |
    - name: README
      url: https://raw.githubusercontent.com/saidsef/argocd-applicationsets-services/main/README.md
    - name: LICENSE
      url: https://raw.githubusercontent.com/saidsef/argocd-applicationsets-services/main/LICENSE.md
    - name: CONTRIBUTING
      url: https://raw.githubusercontent.com/saidsef/argocd-applicationsets-services/main/CONTRIBUTING.md
    - name: HELM
      url: https://raw.githubusercontent.com/saidsef/argocd-applicationsets-services/main/charts/applicationset/README.md
