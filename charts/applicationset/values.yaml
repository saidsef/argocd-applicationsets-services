# -- ApplicationSet name
name: 'pr-reviews'

# -- ArgoCD controller Namespace deployed
namespace: 'argocd'

# -- Global default variables
globals:
  # -- applications annotations
  # @schema-pattern: ^[a-zA-Z0-9_-]+$
  annotations:
    notifications.argoproj.io/subscribe.on-deleted.slack: argocd
    notifications.argoproj.io/subscribe.on-deployed.slack: argocd
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argocd
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd
    notifications.argoproj.io/subscribe.on-sync-running.slack: argocd

  # -- (int) GitHub polling rate (seconds)
  requeueAfterSeconds: 500

  # -- (int) How many old objects should be retained
  revisionHistoryLimit: 2

  # -- (string) The amount to back off retries of failed syncs
  retryBackoffDuration: '10s'

  # -- (list) Go template options for the ApplicationSet controller. 'missingkey=error'
  # fails rendering on any unresolved template key. Requires ArgoCD >= v2.8.0.
  goTemplateOptions:
    - missingkey=error

  # -- Preserve an Application's child resources when the parent Application is deleted
  preserveResourcesOnDeletion: false

  # -- ArgoCD server address. Use 'all' to deploy each preview to every registered
  # cluster (renders a matrix of the cluster generator and the pull request generator)
  server: 'https://kubernetes.default.svc'

  # -- Kubernetes namespace to deploy previews
  deployToNamespace: 'previews'

  # -- GitHub label to filter PRs that you want to target
  label: 'preview'

  # -- syncOptions how it syncs the desired state in the target cluster
  syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - PruneLast=true
    - PrunePropagationPolicy=foreground
    - RespectIgnoreDifferences=true
    - Validate=false

# -- ArgoCD Project parameters
project:
  enabled: false
  permitOnlyProjectScopedClusters: false
  clusterResourceBlacklist:
  - group: 'apiextensions.k8s.io'
    kind: 'CustomResourceDefinition'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  # -- Only permit applications to deploy to the previews namespace in the same cluster
  destinations:
  - namespace: 'previews'
    server: '*'
    name: '*'
  # -- No destination service accounts by default
  destinationServiceAccounts: []
  # -- Allow all namespaced-scoped resources to be created, except for AppProject
  namespaceResourceBlacklist:
  - group: 'argoproj.io'
    kind: 'AppProject'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  orphanedResources:
    warn: false
  roles: []
  # -- Allow from all repositories
  sourceRepos:
  - '*'
  syncWindows: []

# -- GitHub repo configuration parameters
github:
  api: https://api.github.com
  label: 'preview'
  # -- (list) Filter PRs by multiple labels (a PR must carry ALL of them). Overrides `label` when set.
  # labels:
  #   - preview
  #   - ready
  # -- (string) GitHub organisation / owner. Required when `repos.github` is populated.
  owner: ''
  path: 'deployment'
  secretName: ''
  secretKey: ''
  appSecretName: ''

# -- GitLab repo configuration parameters
gitlab:
  api: https://gitlab.com
  # -- (string) GitLab group. Required when `repos.gitlab` is populated.
  group: ''
  label: 'preview'
  # -- (list) Filter MRs by multiple labels (an MR must carry ALL of them). Overrides `label` when set.
  # labels:
  #   - preview
  # -- MR state filter, one of: "", opened, closed, merged or locked
  pullRequestState: 'opened'
  # -- Skip validating the GitLab TLS certificate (useful for self-signed certificates)
  insecure: false
  # -- ConfigMap holding trusted CA certs for self-signed GitLab TLS (leave empty to disable)
  caRef: {}
  #  configMapName: argocd-tls-certs-cm
  #  key: gitlab-ca
  path: 'deployment'
  secretName: ''
  secretKey: ''

# -- List of repo names and override images for preview environment. Both providers are
# empty by default; each renders only when you populate it, so declaring one never pulls
# in the other. Generator tokens are Go template, so they need the leading dot -
# '{{ .branch_slug }}', not '{{branch_slug}}'. Requires ArgoCD >= v2.5.0.
# Worked examples: values-example.yaml
# See: https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-Pull-Request/
repos:
  # -- (list) GitHub repos to build previews for. Requires `github.owner`.
  github: []
  # -- (list) GitLab repos to build previews for. Requires `gitlab.group`.
  gitlab: []
