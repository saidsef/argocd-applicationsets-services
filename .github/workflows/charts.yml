name: charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  pull_request:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      security-events: write
      contents: write
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' || contains(github.ref, 'main') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Dependency Review'
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v5
        with:
          allow-ghsas: true
          comment-summary-in-pr: always
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Setup Chart Linting
        if: ${{ github.event_name == 'pull_request' }}
        id: lint
        uses: helm/chart-testing-action@v2.8.0
      - name: Run chart-testing (list-changed)
        if: ${{ github.event_name == 'pull_request' }}
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi
      - name: Run chart-testing (lint)
        if: ${{ github.event_name == 'pull_request' }}
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false
      - name: Configure Git
        if: ${{ contains(github.ref, 'main') }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Copy Readme and License
        if: ${{ contains(github.ref, 'main') }}
        run: |
          cp -v *.md charts/applicationset/
      - name: Run chart-releaser
        if: ${{ contains(github.ref, 'main') }}
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          config: charts/cr.yml
          mark_as_latest: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 #v3.29.5
        continue-on-error: true
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd #v3.29.5
        continue-on-error: true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd #v3.29.5
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-review:
    uses: saidsef/saidsef/.github/workflows/dependency-review.yaml@main
    if: ${{ github.event_name == 'pull_request' }}
    needs: [chart]
    permissions:
      pull-requests: write

  k8s-test:
    runs-on: ubuntu-latest
    needs: [chart]
    if: ${{ ! contains(github.ref, 'main') }}
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          kubectl_version: v1.33.7 # Ensure compatibility with the latest APIs
          node_image: kindest/node:v1.33.7 # Match node version with kubectl for consistency
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run K8s test
        run: |
          kubectl cluster-info
          kubectl create ns argocd
          kubectl apply --server-side -k https://github.com/argoproj/argo-cd/manifests/crds\?ref\=stable -n argocd
          # Server-side apply returns before the CRDs are established, so the chart applied below
          # would not find the ApplicationSet kind. kubectl wait errors rather than waiting while
          # .status.conditions is still absent, so retry until the conditions are populated.
          for attempt in $(seq 30); do
            kubectl wait --for=condition=Established --timeout=10s \
              crd/applications.argoproj.io crd/applicationsets.argoproj.io crd/appprojects.argoproj.io && break
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::ArgoCD CRDs did not reach Established"
              exit 1
            fi
            sleep 2
          done
          # Both repos lists default to empty, so an install that names no repo is a no-op
          # rather than one that adopts the chart's own.
          if [[ -n "$(helm template appsets charts/applicationset --namespace argocd)" ]]; then
            echo "::error::chart defaults rendered objects; repos.github and repos.gitlab must default to empty"
            exit 1
          fi
          helm template appsets charts/applicationset --namespace argocd -f charts/applicationset/values-example.yaml | kubectl apply --server-side --force-conflicts -n argocd -f -
          kubectl get all -A
          kubectl get applications -A -o wide
          kubectl get applicationsets -A -o wide

  auto-approve:
    runs-on: ubuntu-latest
    needs: [chart, k8s-test]
    permissions:
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })
